# Builds Shelf for Xbox (UWP) as a signed .msix with its dependency packages.
# Install through Device Portal: Add → the .msix, then "Allow me to select
# framework packages" → the files in Dependencies\x64.

name: Xbox build

on:
  workflow_dispatch:
  push:
    branches: [main, shelf-xbox]
  workflow_run:
    workflows: [Cores]
    types: [completed]

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # The emulator cores, from the "cores" release made by the Cores workflow.
      - name: Emulator cores
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/cores/Cores.zip"
          try {
            Invoke-WebRequest -UseBasicParsing -OutFile cores.zip $url
            Expand-Archive cores.zip Shelf/Cores -Force
            Get-ChildItem Shelf/Cores | Select-Object Name, Length
          } catch { Write-Warning "No cores release yet: building without emulators." }

      - name: Version
        run: |
          $v = "0.1.${{ github.run_number }}.0"
          "VERSION=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $m = "Shelf/Package.appxmanifest"
          # Only the app's own version: the exact text in <Identity> (string Replace is case-sensitive).
          (Get-Content $m -Raw).Replace('Version="0.1.0.0"', "Version=""$v""") | Set-Content $m -Encoding UTF8
          Select-String -Path $m -Pattern 'Identity'

      # Developer Mode installs any signed package; the certificate's subject
      # only has to match the manifest's Publisher (CN=Shelf).
      - name: Signing certificate
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=Shelf" `
            -KeyUsage DigitalSignature -FriendlyName "Shelf Xbox packages" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "shelf" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\shelf.pfx" -Password $pw | Out-Null
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\Shelf.cer" | Out-Null

      - name: Build
        run: |
          msbuild Shelf/Shelf.csproj /restore /m /v:minimal `
            /p:Configuration=Release /p:Platform=x64 `
            /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            "/p:PackageCertificateKeyFile=$env:RUNNER_TEMP\shelf.pfx" /p:PackageCertificatePassword=shelf `
            "/p:AppxPackageDir=$env:GITHUB_WORKSPACE\out\\"
          if ($LASTEXITCODE -ne 0) { throw "build failed" }

      - name: Collect
        run: |
          $dst = "$env:RUNNER_TEMP\Shelf-Xbox-$env:VERSION"
          New-Item -ItemType Directory -Force $dst | Out-Null
          $pkg = Get-ChildItem out -Recurse -Include *.msix, *.appx | Where-Object { $_.FullName -notmatch '\\Dependencies\\' }
          $pkg | Copy-Item -Destination $dst
          # The same package with an .appx name, for Device Portal versions that only list .appx files.
          $pkg | Where-Object { $_.Extension -eq '.msix' } | ForEach-Object { Copy-Item $_.FullName (Join-Path $dst ($_.BaseName + '.appx')) }
          $deps = Get-ChildItem out -Recurse -Directory -Filter x64 | Where-Object { $_.FullName -match '\\Dependencies\\x64$' } | Select-Object -First 1
          if ($deps) { New-Item -ItemType Directory -Force "$dst\Dependencies" | Out-Null; Copy-Item "$($deps.FullName)\*" "$dst\Dependencies" }
          Copy-Item "$env:RUNNER_TEMP\Shelf.cer" $dst
          Get-ChildItem $dst -Recurse | Select-Object FullName, Length
          Compress-Archive -Path "$dst\*" -DestinationPath "$env:RUNNER_TEMP\Shelf-Xbox-$env:VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Shelf-Xbox
          path: ${{ runner.temp }}/Shelf-Xbox-${{ env.VERSION }}.zip
          retention-days: 14

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Shelf for Xbox ${{ env.VERSION }}
          files: ${{ runner.temp }}/Shelf-Xbox-${{ env.VERSION }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    permissions:
      contents: write
